name: Publish to npm

on:
  # Trigger on version tags: git tag v0.1.0 && git push origin v0.1.0
  push:
    tags:
      - 'v*'
  # Or trigger manually from the Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (npm publish --dry-run, nothing is uploaded)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and validate release
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.enumerate.outputs.list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npx tsc -b

      - name: Run tests
        run: npm test

      - name: Verify every published package has a built dist
        # v0.2.0's tarballs for the 11 app recipes shipped TypeScript
        # source only — they were published from a machine that had never
        # run the build for them. Fail loudly instead of half-publishing.
        run: |
          for pkg in packages/*/; do
            PRIVATE=$(node -p "require('./$pkg/package.json').private || false")
            if [ "$PRIVATE" = "true" ]; then
              continue
            fi
            MAIN=$(node -p "require('./$pkg/package.json').main || ''")
            if [ -z "$MAIN" ]; then
              continue
            fi
            MAIN="${MAIN#./}"
            if [ ! -f "$pkg$MAIN" ]; then
              echo "ERROR: $pkg has main '$MAIN' but the file does not exist — run the build first"
              exit 1
            fi
          done
          echo "All non-private packages have their main built."

      - name: Verify versions match the tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            VERSION=$(node -p "require('./$pkg').version")
            NAME=$(node -p "require('./$pkg').name")
            PRIVATE=$(node -p "require('./$pkg').private || false")
            if [ "$PRIVATE" = "true" ]; then
              echo "SKIP $NAME (private)"
              continue
            fi
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "ERROR: $NAME version $VERSION does not match tag $TAG_VERSION"
              exit 1
            fi
            echo "OK $NAME@$VERSION"
          done

      - name: Enumerate packages to publish
        # Matrix source of truth = the filesystem: any non-private directory
        # under packages/ with a main entry. A forgotten new package can
        # never silently miss the release again.
        id: enumerate
        run: |
          LIST=$(node -e '
            const fs = require("fs");
            const pkgs = fs.readdirSync("packages").filter((name) => {
              try {
                const p = JSON.parse(fs.readFileSync(`packages/${name}/package.json`, "utf8"));
                return !p.private && p.main;
              } catch {
                return false;
              }
            }).sort();
            process.stdout.write(JSON.stringify(pkgs));
          ')
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish @r8s/${{ matrix.package }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # A flaky registry call fails one package — never the whole release.
      # npm does not require dependencies to exist at publish time, so the
      # matrix is order-free; retried runs skip already-published versions.
      # Package list comes from the verify job's filesystem enumeration.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.verify.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npx tsc -b

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          DIR="packages/${{ matrix.package }}"
          PRIVATE=$(node -p "require('./$DIR/package.json').private || false")
          if [ "$PRIVATE" = "true" ]; then
            echo "SKIP ${{ matrix.package }} (private)"
            exit 0
          fi
          NAME=$(node -p "require('./$DIR/package.json').name")
          VERSION=$(node -p "require('./$DIR/package.json').version")
          # Skip if this exact version is already published — makes
          # re-runs of only-failed jobs safe after a partial release.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "SKIP $NAME@$VERSION (already published)"
            exit 0
          fi
          echo "Publishing $NAME@$VERSION..."
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public --workspace "$NAME"
          else
            npm publish --access public --workspace "$NAME"
          fi
