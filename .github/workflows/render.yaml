name: Render Kubernetes Manifests

on:
  push:
    branches: [main, master]
    paths:
      - 'k8s/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'k8s/**'
      - 'packages/**'
      - '.github/workflows/render.yaml'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx tsc -b

      # IMAGE_TAG is read by k8s/r8s.tsx — same mechanism as deploy.yaml.
      # Without it this workflow would write :latest back over the
      # SHA-pinned manifest the deploy workflow produces (flip-flop).
      - name: Render Kubernetes manifests
        run: node packages/cli/dist/cli.js render --entry k8s/r8s.tsx --out k8s/rendered/manifest.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet k8s/rendered/manifest.yaml || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit rendered manifests
        if: steps.git-check.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/rendered/manifest.yaml
          git commit -m "chore: render kubernetes manifests [skip ci]"
          git push
