name: Render Kubernetes Manifests

on:
  push:
    branches: [main, master]
    paths:
      - 'k8s/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'k8s/**'
      - 'packages/**'
      - '.github/workflows/render.yaml'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx tsc -b

      # IMAGE_TAG is read by k8s/r8s.tsx — same mechanism as deploy.yaml.
      # Without it this workflow would write :latest back over the
      # SHA-pinned manifest the deploy workflow produces (flip-flop).
      - name: Render Kubernetes manifests
        run: node packages/cli/dist/cli.js render --entry k8s/r8s.tsx --out k8s/rendered/manifest.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet k8s/rendered/manifest.yaml || echo "changed=true" >> $GITHUB_OUTPUT

      # main is protected — the render bot opens a PR with the freshly
      # rendered manifest instead of pushing to the branch directly.
      - name: Open render PR
        if: steps.git-check.outputs.changed == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: render/${{ github.sha }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b "$BRANCH"
          git add k8s/rendered/manifest.yaml
          git commit -m "chore: render kubernetes manifests for ${{ github.sha }}"
          git push -q origin "$BRANCH"
          gh pr create --head "$BRANCH" --base main \
            --title "chore: render kubernetes manifests (${{ github.event.head_commit.message }})" \
            --body "Auto-rendered from ${{ github.sha }} — merge to sync the committed manifest with the TSX." \
            --label automation || echo "PR already open for this render"
