name: Build & Deploy r8s.berget.ai

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'k8s/**'
      - 'packages/**'
      - '.github/workflows/deploy.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: berget-ai/r8s-docs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version bump commit
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      # Same pattern as berget-k8s-template: every main push gets its own
      # prerelease version (0.1.0-rc.N). The version is the single source
      # of truth for both the image tag and the manifest pin below —
      # no Flux image automation needed.
      - name: Bump rc version
        id: version
        run: |
          npm version prerelease --preid=rc --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          git add package.json
          git commit -m "chore: bump r8s-docs version to $VERSION [skip ci]"
          git push
        working-directory: k8s

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./k8s/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The build job pushed a version-bump commit after this ref —
          # check out main so the render runs on the latest tree.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx tsc -b
      - run: node packages/cli/dist/cli.js render --entry k8s/r8s.tsx --out k8s/rendered/manifest.yaml

      # Pin the image to the rc version built above. Without a changing
      # tag the manifest always says :latest — Flux sees no diff and the
      # cluster never rolls to the newly built image.
      - name: Pin image tag to rc version
        run: |
          VERSION=$(node -p "require('./k8s/package.json').version")
          sed -i "s|ghcr.io/berget-ai/r8s-docs:latest|ghcr.io/berget-ai/r8s-docs:$VERSION|g" k8s/rendered/manifest.yaml
          grep -n "image:" k8s/rendered/manifest.yaml

      - name: Commit rendered manifests
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/rendered/manifest.yaml
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: render manifests [skip ci]" && git push)
