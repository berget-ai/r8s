name: Build & Deploy r8s.berget.ai

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'k8s/**'
      - 'packages/**'
      - '.github/workflows/deploy.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: berget-ai/r8s-docs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./k8s/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx tsc -b

      # IMAGE_TAG is read by k8s/r8s.tsx and set directly on the App
      # component. The image is a function of the source: same commit →
      # same tag → GHCR serves it from cache; new commit → new tag →
      # new build. Without a changing tag the manifest always says
      # :latest, Flux sees no diff, and the cluster never rolls.
      - name: Render manifests with pinned image tag
        run: node packages/cli/dist/cli.js render --entry k8s/r8s.tsx --out k8s/rendered/manifest.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}

      # Branch policy blocks pushes to main — the rendered manifest lands as
      # an auto-updating PR instead. Merging it rolls the docs site via Flux.
      #
      # NOTE: the berget-ai org blocks Actions from creating PRs with the
      # default GITHUB_TOKEN. Create a fine-grained PAT (contents + pull
      # requests, write, this repo only) and store it as secret RENDER_TOKEN;
      # until then the step fails with the org's 403 message.
      - name: Open or update the rendered-manifests PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RENDER_TOKEN || secrets.GITHUB_TOKEN }}
          branch: k8s/rendered-manifests
          delete-branch: true
          title: 'chore: render manifests [skip ci]'
          commit-message: 'chore: render manifests [skip ci]'
          body: |
            Auto-rendered r8s docs manifests with IMAGE_TAG pinned to the run
            that produced them. Merge to roll the docs site via Flux.
          labels: gitops
