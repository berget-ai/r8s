name: Feature Request
description: Suggest a new feature or component for r8s
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! The more context you give, the better the discussion.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point. Why do you need this?
      placeholder: "I'm trying to deploy X and currently I have to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A sketch of the component API is very welcome.
      placeholder: |
        <Kafka name="events" partitions={12} />
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you found a workaround? How do you solve this today?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to implement this myself with guidance
