# Operator declarations — the single source of truth for operator installs.
#
# Each entry maps an operator name to its install source (helm/manifest/olm),
# the CRDs it provides, and the namespace it runs in. The @r8s/crds package
# reads this file to generate the `operators` export used by recipes and the
# CLI's `declareOperator()` mechanism.
#
# To add a new operator:
#   1. Vendor its CRD YAML under crds/<group>/<version>/
#   2. Add an entry below
#   3. Run: npm run generate -w @r8s/crds

- name: cert-manager
  description: cert-manager for TLS certificate automation
  category: Security & Identity
  source:
    type: manifest
    url: https://github.com/cert-manager/cert-manager/releases/download/v{version}/cert-manager.yaml
  version: '1.18.0'
  namespace: cert-manager
  crds:
    - certificates.cert-manager.io
    - certificaterequests.cert-manager.io
    - issuers.cert-manager.io
    - clusterissuers.cert-manager.io

- name: clickhouse-operator
  description: ClickHouse Operator for Kubernetes by Altinity
  category: Data & Analytics
  source:
    type: helm
    chart: clickhouse-operator-helm
    repository: https://docs.altinity.com/clickhouse-operator/
  version: '0.25.0'
  namespace: clickhouse-operator-system
  crds:
    - clickhouseinstallations.clickhouse.altinity.com
    - clickhouseinstallationtemplates.clickhouse.altinity.com
    - clickhouseoperatorconfigurations.clickhouse.altinity.com
    - clickhousekeeperinstallations.clickhouse-keeper.altinity.com

- name: cnpg
  description: CloudNativePG PostgreSQL operator
  category: Data & Analytics
  source:
    type: manifest
    url: https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-{minor}/releases/cnpg-{version}.yaml
  version: '1.27.0'
  namespace: cnpg-system
  crds:
    - clusters.postgresql.cnpg.io
    - poolers.postgresql.cnpg.io
    - scheduledbackups.postgresql.cnpg.io

- name: envoy-gateway
  description: Envoy Gateway — Kubernetes Gateway API implementation
  category: Networking
  source:
    type: helm
    chart: gateway-helm
    repository: oci://docker.io/envoyproxy
  version: '1.7.0'
  namespace: envoy-gateway-system
  crds:
    - gatewayclasses.gateway.networking.k8s.io
    - gateways.gateway.networking.k8s.io
    - httproutes.gateway.networking.k8s.io
    - grpcroutes.gateway.networking.k8s.io
    - tlsroutes.gateway.networking.k8s.io
    - tcproutes.gateway.networking.k8s.io
    - udproutes.gateway.networking.k8s.io
    - envoyproxies.gateway.envoyproxy.io
    - backendtrafficpolicies.gateway.envoyproxy.io
    - clienttrafficpolicies.gateway.envoyproxy.io
    - securitypolicies.gateway.envoyproxy.io

- name: external-dns
  description: ExternalDNS for automatic DNS management
  category: Networking
  source:
    type: manifest
    url: https://raw.githubusercontent.com/kubernetes-sigs/external-dns/v{version}/docs/sources/manifest.yaml
  version: '0.14.0'
  namespace: external-dns
  crds:
    - dnsendpoints.externaldns.k8s.io

- name: keycloak-operator
  description: Keycloak identity and access management operator
  category: Security & Identity
  source:
    type: olm
    package: keycloak-operator
    channel: fast
  version: '24.0.0'
  crds:
    - keycloaks.k8s.keycloak.org
    - keycloakrealmimports.k8s.keycloak.org

- name: logging-operator
  description: Logging Operator for Kubernetes by Banzai Cloud
  category: Observability
  source:
    type: helm
    chart: logging-operator
    repository: https://kube-logging.github.io/helm-charts
  version: '4.2.3'
  namespace: logging
  crds:
    - loggings.logging.banzaicloud.io
    - flows.logging.banzaicloud.io
    - clusterflows.logging.banzaicloud.io
    - outputs.logging.banzaicloud.io
    - clusteroutputs.logging.banzaicloud.io

- name: loki
  description: Grafana Loki — horizontally-scalable, highly-available log aggregation
  category: Observability
  source:
    type: helm
    chart: loki
    repository: https://grafana.github.io/helm-charts
  version: '5.47.0'
  namespace: loki
  crds:
    - lokistacks.loki.grafana.com
    - alertingrules.loki.grafana.com
    - recordingrules.loki.grafana.com
    - rulerconfigs.loki.grafana.com

- name: prometheus
  description: Prometheus monitoring stack (kube-prometheus-stack)
  category: Observability
  source:
    type: helm
    chart: kube-prometheus-stack
    repository: https://prometheus-community.github.io/helm-charts
  version: '58.4.0'
  namespace: monitoring
  crds:
    - alertmanagers.monitoring.coreos.com
    - alertmanagerconfigs.monitoring.coreos.com
    - podmonitors.monitoring.coreos.com
    - probes.monitoring.coreos.com
    - prometheuses.monitoring.coreos.com
    - prometheusrules.monitoring.coreos.com
    - scrapeconfigs.monitoring.coreos.com
    - servicemonitors.monitoring.coreos.com
    - thanosrulers.monitoring.coreos.com

- name: redis-operator
  description: Redis Operator for Kubernetes by OT-Container-Kit
  category: Data & Analytics
  source:
    type: helm
    chart: redis-operator
    repository: https://ot-container-kit.github.io/helm-charts/
  version: '0.22.0'
  namespace: kube-system
  crds:
    - redisclusters.redis.redis.opstreelabs.in
    - redisreplications.redis.redis.opstreelabs.in
    - redisfailovers.databases.spotahome.com

- name: vault-secrets-operator
  description: HashiCorp Vault Secrets Operator
  category: Security & Identity
  source:
    type: manifest
    url: https://raw.githubusercontent.com/hashicorp/vault-secrets-operator/v{version}/config/default/deploy.yaml
  version: '0.5.0'
  namespace: vault-secrets-operator
  crds:
    - vaultstaticsecrets.secrets.hashicorp.com
    - vaultdynamicsecrets.secrets.hashicorp.com
    - vaultauths.secrets.hashicorp.com
    - vaultconnections.secrets.hashicorp.com

- name: velero
  description: Velero backup and disaster recovery
  category: Security & Identity
