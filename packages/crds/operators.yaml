    type: manifest
    url: https://raw.githubusercontent.com/vmware-tanzu/velero/v{version}/config/crd/v1/bases/velero.io_backups.yaml
  version: '1.13.0'
  namespace: velero
  crds:
    - backups.velero.io
    - restores.velero.io
    - schedules.velero.io
    - backupstoragelocations.velero.io
    - volumesnapshotlocations.velero.io
    - deletebackuprequests.velero.io
    - downloadrequests.velero.io
